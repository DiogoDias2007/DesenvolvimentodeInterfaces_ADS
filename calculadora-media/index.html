<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Média</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <h1>Calculadora de Média</h1>

    <label for="nome">Nome do estudante</label>
    <input type="text" id="nome" placeholder="Ex.: Ana Souza">

    <label for="nota1">Nota 1</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1">

    <label for="nota2">Nota 2</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1">

    <label for="nota3">Nota 3</label>
    <input type="number" id="nota3" min="0" max="10" step="0.1">

    <button type="button" id="calcular">Calcular média</button>

    <p id="resultado" class="resultado" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
