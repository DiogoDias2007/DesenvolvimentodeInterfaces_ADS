<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolução — Aulas 1 e 2</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container">
    <h1>Evolução da Calculadora — Aulas 1 e 2</h1>
    <p>Abra o console (F12 → Console) e clique numa versão. As versões com <code>prompt()</code> pedem os dados em caixas de diálogo.</p>

    <button type="button" onclick="executar('aula1-versao1.js')">Aula 1 — Versão 1: dados no código</button>
    <button type="button" onclick="executar('aula1-versao2.js')">Aula 1 — Versão 2: dados pelo prompt</button>
    <button type="button" onclick="executar('aula2-versao3.js')">Aula 2 — Versão 3: funções e classificação</button>
    <button type="button" onclick="executar('aula2-versao4.js')">Aula 2 — Versão 4: validação</button>
    <button type="button" onclick="executar('extensao-repeticao.js')">Aula 2 — Extensão: repetição com while</button>

    <p><a href="../">Ir para a aplicação final (Aula 3)</a></p>
  </main>

  <script>
    // Cada versão roda numa página nova, porque todas declaram as mesmas constantes.
    function executar(arquivo) {
      window.location.href = "executar.html?arquivo=" + arquivo;
    }
  </script>
</body>
</html>
